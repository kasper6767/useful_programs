  <path d="M110 515H850" stroke="#d5dbe1"/><path d="M110 438L820 592" fill="none" stroke="#2463a6" stroke-width="3"/><path d="M110 430L820 602" fill="none" stroke="#2463a6" stroke-width="3" stroke-dasharray="8 5"/>
