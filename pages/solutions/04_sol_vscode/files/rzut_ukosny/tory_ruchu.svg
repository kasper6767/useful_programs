<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Porównanie torów rzutu ukośnego</title>
  <desc id="desc">Schematyczne parabole dla braku oporu oraz oporu liniowego i kwadratowego. Punkt startu i lądowania leżą na poziomie y równe zero, położenie lądowania jest ujemne.</desc>
  <rect width="900" height="500" fill="#fff"/><text x="52" y="42" fill="#233044" font-family="sans-serif" font-size="23" font-weight="700">Tory ruchu: trzy modele</text>
