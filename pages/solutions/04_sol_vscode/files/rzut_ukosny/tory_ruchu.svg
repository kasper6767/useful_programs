  <text x="118" y="452" font-family="sans-serif" font-size="14" fill="#64748b">−22</text><text x="472" y="452" font-family="sans-serif" font-size="14" fill="#64748b">−11</text><text x="840" y="452" font-family="sans-serif" font-size="14" fill="#64748b">0</text>
  <text x="395" y="484" font-family="sans-serif" font-size="16" fill="#233044">Położenie poziome x [m]</text><text transform="translate(27 300) rotate(-90)" font-family="sans-serif" font-size="16" fill="#233044">Wysokość y [m]</text>
